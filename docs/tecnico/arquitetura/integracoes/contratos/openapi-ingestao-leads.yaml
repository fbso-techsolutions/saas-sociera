openapi: 3.1.0
info:
  title: API de Leads — Sociera
  version: 0.3.0-proposta
  summary: Ingestão e consulta de leads (CRUD) do Sociera.
  description: |
    API do domínio de Leads do Sociera.
    - **POST** `/v1/leads`: ingestão de manifestações de interesse do portal e canais autorizados.
    - **GET** `/v1/leads` e `/v1/leads/{leadId}`: consulta (listagem/detalhe) para o CRM interno.

    O lead é associado a uma Party (pessoa ou organização) e ao papel LEAD.
    Diretrizes:
      - API-First e contrato OpenAPI 3.1.
      - Party Model: Party + PartyRole.
      - Multi-tenancy determinado pelo contexto de autenticação — nunca por um tenantId
        livremente informado pelo consumidor.
      - Idempotência por `Idempotency-Key`; deduplicação de contatos tratada separadamente.
      - Minimização de dados e registro de evidências de privacidade conforme a base legal.
  contact:
    name: Engenharia — Sociera
  license:
    name: Uso interno FBSO
    url: https://fbso.com.br/legal

servers:
  - url: https://api.fbsosociera.com.br
    description: URL proposta; domínio e ambiente a confirmar.

security:
  - OAuth2Bearer: []

tags:
  - name: leads
    description: Ingestão e consulta de leads.

paths:
  /v1/leads:
    post:
      tags: [leads]
      operationId: ingestLead
      summary: Registrar lead vindo do portal
      description: |
        Recebe uma manifestação de interesse e cria/associa os registros no núcleo Party.
        A `Idempotency-Key` identifica uma tentativa lógica de envio: repetir a mesma chave com o
        mesmo conteúdo retorna o resultado original (200); reutilizar a mesma chave com conteúdo
        diferente retorna 409. Deduplicação por e-mail é regra de negócio distinta (associa à Party).
      security:
        - OAuth2Bearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única por tentativa lógica de submissão (UUID). Retenção definida pela política operacional.
          schema:
            type: string
            minLength: 16
            maxLength: 128
          example: "portal-9f2c1e8a-4b1e-4c0a-9d1e-1a2b3c4d5e6f"
        - name: X-Correlation-ID
          in: header
          required: false
          description: Identificador de correlação para rastreamento distribuído.
          schema:
            type: string
            maxLength: 128
          example: "b7d7f6d2-4dcb-4b9b-9a6c-4f0a3e1c7b10"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadIngestionRequest"
            examples:
              b2bSaaS:
                summary: Contato de organização interessado em solução SaaS
                value:
                  contact:
                    name: Maria Souza
                    email: maria.souza@empresa.com.br
                    phone: "+55 11 99999-0000"
                    jobTitle: Diretora Financeira
                  organization:
                    name: Empresa Exemplo Ltda
                    website: https://www.empresa.com.br
                    industry: SERVICOS
                    companySize: MEDIUM
                  interest:
                    category: SAAS
                    offerings: [CONTABILIDADE, CRM]
                    description: Gostaria de conhecer as funcionalidades e os planos.
                  message:
                    subject: Demonstração das plataformas
                    body: Temos interesse em avaliar as soluções para nossa operação.
                    preferredContactChannel: EMAIL
                  acquisition:
                    source: google
                    medium: cpc
                    campaign: q4-crm-lancamento
                    referrerUrl: https://www.google.com/
                    landingPageUrl: https://www.fbso.com.br/solucoes
                    capturedAt: "2026-11-26T10:30:00-03:00"
                  privacy:
                    privacyNoticeVersion: "1.0"
                    privacyNoticeUrl: https://www.fbso.com.br/privacidade
                    acknowledgedAt: "2026-11-26T10:30:00-03:00"
                    marketing:
                      accepted: false
              b2bConsulting:
                summary: Pessoa física interessada em consultoria
                value:
                  contact:
                    name: João da Silva
                    email: joao@example.com
                    phone: "+55 11 98888-7777"
                  interest:
                    category: CONSULTING
                    offerings: [CLOUD_DEVOPS, SOFTWARE_DEVELOPMENT]
                    description: Preciso de apoio para modernização de aplicações.
                  message:
                    body: Gostaria de conversar com um especialista.
                    preferredContactChannel: WHATSAPP
                  acquisition:
                    source: direct
                    medium: website
                    landingPageUrl: https://www.fbso.com.br/contato
                    capturedAt: "2026-11-26T10:30:00-03:00"
                  privacy:
                    privacyNoticeVersion: "1.0"
                    privacyNoticeUrl: https://www.fbso.com.br/privacidade
                    acknowledgedAt: "2026-11-26T10:30:00-03:00"
      responses:
        "201":
          description: Lead criado e registrado.
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri
            Idempotency-Replayed:
              description: Indica se o resultado foi recuperado de uma requisição anterior.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadIngestionResponse"
        "200":
          description: Requisição repetida com a mesma chave/conteúdo; retorna o resultado original.
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadIngestionResponse"
        "400":
          description: Requisição malformada ou cabeçalho obrigatório ausente.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Token ausente, inválido ou expirado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Credencial autenticada sem permissão para ingestão de leads.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflito de idempotência — mesma chave com conteúdo diferente.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Dados semanticamente inválidos ou regras de validação não atendidas.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Limite de requisições excedido.
          headers:
            Retry-After:
              description: Tempo em segundos recomendado antes de nova tentativa.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Serviço temporariamente indisponível; consumidor pode tentar novamente.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      tags: [leads]
      operationId: listLeads
      summary: Listar leads (CRM interno)
      description: Lista leads com paginação e filtros. Uso interno do CRM.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InterestCategory"
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Página de leads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCollection"
        "401":
          description: Não autenticado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/leads/{leadId}:
    get:
      tags: [leads]
      operationId: getLead
      summary: Detalhar lead
      description: Retorna um lead pelo identificador. Uso interno do CRM.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lead localizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Lead não encontrado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    OAuth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT (OAuth2/OIDC via Keycloak auto-hospedado). O `tenant_id` vem das claims do token.
        - Portal (machine-to-machine): obtém o token via **client credentials**.
        - CRM (usuário): obtém o token via **authorization code**.

  schemas:
    LeadIngestionRequest:
      type: object
      additionalProperties: false
      required: [contact, interest, privacy]
      properties:
        contact:
          $ref: "#/components/schemas/LeadContact"
        organization:
          $ref: "#/components/schemas/LeadOrganization"
        interest:
          $ref: "#/components/schemas/LeadInterest"
        message:
          $ref: "#/components/schemas/LeadMessage"
        acquisition:
          $ref: "#/components/schemas/LeadAcquisition"
        privacy:
          $ref: "#/components/schemas/LeadPrivacy"

    LeadContact:
      type: object
      additionalProperties: false
      required: [name, email]
      description: Pessoa de contato — sempre pessoa física (Party INDIVIDUAL).
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          description: Nome da pessoa de contato.
          examples: ["Maria Souza"]
        email:
          type: string
          format: email
          maxLength: 254
          description: E-mail principal para retorno.
          examples: ["maria.souza@empresa.com.br"]
        phone:
          type: string
          maxLength: 32
          description: Telefone de contato, preferencialmente E.164.
          examples: ["+55 11 99999-0000"]
        mobilePhone:
          type: string
          maxLength: 32
          description: Celular, quando diferente do telefone principal.
        jobTitle:
          type: string
          maxLength: 120
          description: Cargo ou função do contato.
        department:
          type: string
          maxLength: 120
          description: Departamento do contato.
        linkedinUrl:
          type: string
          format: uri
          maxLength: 500
          description: URL pública do perfil profissional, quando fornecida.

    LeadOrganization:
      type: object
      additionalProperties: false
      description: Empresa de origem do contato (contexto B2B — Party ORGANIZATION). Opcional.
      properties:
        name:
          type: string
          maxLength: 200
          description: Razão social ou nome da empresa.
        tradeName:
          type: string
          maxLength: 200
          description: Nome fantasia.
        taxId:
          type: string
          maxLength: 32
          description: CPF/CNPJ ou identificador fiscal. Não exigir no formulário público.
        website:
          type: string
          format: uri
          maxLength: 500
        industry:
          type: string
          maxLength: 80
          description: Código do segmento econômico conforme catálogo configurado.
          examples: ["SERVICOS"]
        companySize:
          type: string
          enum: [MICRO, SMALL, MEDIUM, LARGE, ENTERPRISE, UNKNOWN]
        address:
          $ref: "#/components/schemas/PostalAddress"

    PostalAddress:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: Código ISO 3166-1 alpha-2.
          examples: ["BR"]
        state:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 120
        postalCode:
          type: string
          maxLength: 20
        street:
          type: string
          maxLength: 200
        number:
          type: string
          maxLength: 30
        complement:
          type: string
          maxLength: 120
        neighborhood:
          type: string
          maxLength: 120

    InterestCategory:
      type: string
      enum: [SAAS, CONSULTING, PARTNERSHIP, OTHER]
      description: Categoria macro de interesse.

    LeadInterest:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category:
          $ref: "#/components/schemas/InterestCategory"
        offerings:
          type: array
          uniqueItems: true
          maxItems: 20
          description: |
            Códigos do catálogo unificado de ofertas (SaaS + serviços de consultoria).
            Catálogo: EDUCACAO, CONTABILIDADE, VAREJO, ECONOMIA_CIRCULAR, CRM (SaaS) ·
            SOFTWARE_DEVELOPMENT, CLOUD_DEVOPS, SUPPORT_SERVICES, ARTIFICIAL_INTELLIGENCE (consultoria).
          items:
            type: string
            minLength: 2
            maxLength: 80
          examples:
            - [CONTABILIDADE, CRM]
            - [CLOUD_DEVOPS, SOFTWARE_DEVELOPMENT]
        description:
          type: string
          maxLength: 3000
          description: Contexto adicional sobre a necessidade ou solução procurada.

    LeadMessage:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 5000
        preferredContactChannel:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP, ANY]
        preferredContactPeriod:
          type: string
          enum: [BUSINESS_HOURS, MORNING, AFTERNOON, EVENING, ANY]

    LeadAcquisition:
      type: object
      additionalProperties: false
      description: Dados de atribuição e rastreabilidade da aquisição.
      properties:
        source:
          type: string
          maxLength: 200
          examples: ["google"]
        medium:
          type: string
          maxLength: 200
          examples: ["cpc"]
        campaign:
          type: string
          maxLength: 200
        campaignId:
          type: string
          maxLength: 200
        term:
          type: string
          maxLength: 500
        content:
          type: string
          maxLength: 500
        referrerUrl:
          type: string
          format: uri
          maxLength: 2000
        landingPageUrl:
          type: string
          format: uri
          maxLength: 2000
        clickIds:
          type: object
          description: Identificadores de clique de plataformas de publicidade, quando aplicáveis.
          additionalProperties:
            type: string
            maxLength: 1000
        capturedAt:
          type: string
          format: date-time
          description: Data/hora da captura no canal de origem.
        firstTouchAt:
          type: string
          format: date-time
          description: Primeira interação conhecida, se disponível no canal.

    LeadPrivacy:
      type: object
      additionalProperties: false
      required: [privacyNoticeVersion, acknowledgedAt]
      description: Evidências do aviso de privacidade apresentado no momento da coleta.
      properties:
        privacyNoticeVersion:
          type: string
          maxLength: 40
          examples: ["1.0"]
        privacyNoticeUrl:
          type: string
          format: uri
          maxLength: 1000
        acknowledgedAt:
          type: string
          format: date-time
          description: Data/hora em que o titular confirmou ciência do aviso.
        marketing:
          $ref: "#/components/schemas/MarketingPreference"

    MarketingPreference:
      type: object
      additionalProperties: false
      description: |
        Preferência específica para comunicações de marketing. Não é autorização genérica para
        qualquer tratamento de dados; a base legal deve ser definida pela operação responsável.
      properties:
        accepted:
          type: boolean
          default: false
        purpose:
          type: string
          maxLength: 300
          examples: ["Receber novidades e comunicações sobre produtos e serviços FBSO."]
        recordedAt:
          type: string
          format: date-time

    LeadStatus:
      type: string
      enum: [NEW, ASSOCIATED, QUALIFIED, IN_PROGRESS, CONVERTED, LOST]
      description: |
        Ciclo de vida do lead. Na ingestão, retorna NEW (novo) ou ASSOCIATED (dedup).
        QUALIFIED/CONVERTED/... são da gestão comercial (visíveis via GET).

    LeadIngestionResponse:
      type: object
      additionalProperties: false
      required: [id, partyId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do registro Lead no Sociera.
        partyId:
          type: string
          format: uuid
          description: Identificador da Party associada.
        status:
          $ref: "#/components/schemas/LeadStatus"
        duplicate:
          type: boolean
          description: Indica se a manifestação foi associada a um registro/Party existente.
        createdAt:
          type: string
          format: date-time
        href:
          type: string
          format: uri
          description: URI para consulta do recurso.

    Lead:
      type: object
      additionalProperties: false
      required: [id, partyId, status, contact, interest, privacy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LeadStatus"
        contact:
          $ref: "#/components/schemas/LeadContact"
        organization:
          $ref: "#/components/schemas/LeadOrganization"
        interest:
          $ref: "#/components/schemas/LeadInterest"
        message:
          $ref: "#/components/schemas/LeadMessage"
        acquisition:
          $ref: "#/components/schemas/LeadAcquisition"
        privacy:
          $ref: "#/components/schemas/LeadPrivacy"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        href:
          type: string
          format: uri

    LeadCollection:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
        total:
          type: integer
          examples: [128]
        limit:
          type: integer
          examples: [20]
        offset:
          type: integer
          examples: [0]

    Problem:
      type: object
      description: Formato de erro inspirado em RFC 9457 (Problem Details).
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ["https://api.fbsosociera.com.br/problems/validation-error"]
        title:
          type: string
          examples: ["Validation failed"]
        status:
          type: integer
          minimum: 400
          maximum: 599
          examples: [422]
        detail:
          type: string
          examples: ["Um ou mais campos não atendem às regras de validação."]
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Código estável de erro definido pelo Sociera.
          examples: ["LEAD_VALIDATION_FAILED"]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        correlationId:
          type: string

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          examples: ["contact.email"]
        message:
          type: string
          examples: ["Deve ser um endereço de e-mail válido."]
        code:
          type: string
          examples: ["INVALID_FORMAT"]
